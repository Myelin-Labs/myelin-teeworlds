[package]
name = "teeworlds-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["cargo", "derive"] }
num-format = "0.4"
rand = "0.10.1"
secp256k1 = { version = "0.30.0", features = ["recovery"] }
serde_json = "1.0.149"
tempfile = "3.27.0"

ckb-chain-spec = "1.1.0"
ckb-hash = "1.1.0"
ckb-jsonrpc-types = "1.1.1"
ckb-mock-tx-types = "1.1.1"
ckb-script = "1.1.0"
ckb-sdk = "5.1.0"
ckb-types = "1.1.0"

ckb-tx-builder = { path = "../ckb-tx-builder" }
map-packer = { path = "../map-packer" }
